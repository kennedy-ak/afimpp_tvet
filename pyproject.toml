[project]
name = "afimpp-project"
version = "0.1.0"
description = "AfIMMP TVTC - Django Web Application for Mining and Vocational Training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crispy-bootstrap5>=2025.6",
    "django>=6.0",
    "django-crispy-forms>=2.5",
    "pillow>=12.0.0",
    "psycopg2-binary>=2.9.11",
    "python-decouple>=3.8",
    "gunicorn>=21.0",
    "whitenoise>=6.0",
    "django-extensions>=3.0",
    "django-meta>=4.0",
    "django-robots>=4.0",
    "django-sitemap>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.0",
    "django-debug-toolbar>=4.0",
    "black>=23.0",
    "flake8>=6.0",
]
production = [
    "django-heroku>=0.3.1",
    "django-cors-headers>=4.0",
    "celery>=5.0",
    "redis>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?

extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
